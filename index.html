<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jako · Mei Eden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail + top bar + scrolling content. Light, dense enterprise UI in Jako's ink/green on warm white. */
:root{
  --bg:#F4F3EE; --surface:#FFFFFF; --surface-2:#F7F6F2; --surface-3:#EFEEE8;
  --line:#E4E2DA; --line-strong:#CFCDC4;
  --ink:#1C1E22; --ink-2:#4A4E55; --ink-3:#7A7E85; --ink-4:#A3A7AD;
  --accent:#20674F; --accent-deep:#154635; --accent-soft:#E4EFE9; --accent-soft-2:#CFE3D8;
  --blue:#2563EB; --blue-soft:#E4ECFB; --amber:#B86E0F; --amber-soft:#FBEFD9; --red:#C62828; --red-soft:#FBE4E4;
  --chart-1:#1E8A62; --chart-2:#2E6DB4; --chart-3:#BF7416; --chart-4:#9A58B5;
  --map-sea:#DCE7EC; --map-land:#F1F0EA; --map-road:#FFFFFF; --map-road-edge:#DAD8D0; --map-water:#C9DAE3; --map-park:#E6ECDC;
  --font:'Instrument Sans','IBM Plex Sans Hebrew',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-he:'IBM Plex Sans Hebrew','Instrument Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px; --r-sm:6px; --r-lg:12px;
  --shadow:0 1px 2px rgba(28,30,34,.06),0 1px 1px rgba(28,30,34,.04);
  --shadow-2:0 6px 24px rgba(28,30,34,.10),0 2px 6px rgba(28,30,34,.06);
  --side-w:224px; --top-h:52px;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
[dir=rtl] body, body[dir=rtl], html[dir=rtl] body{font-family:var(--font-he)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-2)}
.small{font-size:12px}
.xs{font-size:11px}
.b{font-weight:600}
.cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
[dir=rtl] .cap{letter-spacing:0}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app{display:flex;height:100%;min-height:0}
.side{width:var(--side-w);flex:0 0 var(--side-w);background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{height:var(--top-h);display:flex;align-items:center;padding-inline:18px;border-bottom:1px solid var(--line);gap:10px}
.brand img{height:26px;width:auto;display:block}
.ws{margin:12px 12px 4px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);display:flex;align-items:center;gap:10px}
.ws .ws-mark{width:28px;height:28px;border-radius:7px;background:var(--accent-deep);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.ws .ws-name{font-weight:600;font-size:13px;line-height:1.2}
.ws .ws-sub{font-size:11px;color:var(--ink-3)}
.nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav .grp{margin-top:12px;margin-bottom:4px;padding-inline:8px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--ink-2);text-decoration:none;font-weight:500;border:0;width:100%;text-align:start}
.nav a svg{width:17px;height:17px;flex:0 0 17px;color:var(--ink-3)}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-deep)}
.nav a.on svg{color:var(--accent)}
.nav a .cnt{margin-inline-start:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav a.on .cnt{color:var(--accent-deep)}
.nav a .dot{margin-inline-start:auto;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.side-foot .ok{width:7px;height:7px;border-radius:50%;background:var(--accent)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.top{height:var(--top-h);flex:0 0 var(--top-h);display:flex;align-items:center;gap:14px;padding-inline:20px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .crumb{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0;white-space:nowrap}
.top .crumb .sep{color:var(--ink-4);font-weight:400}
.top .crumb .ctx{color:var(--ink-3);font-weight:500}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;color:var(--ink-3);margin-inline:auto}
.search svg{width:15px;height:15px;flex:0 0 15px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--ink);font-size:13px}
.search input::placeholder{color:var(--ink-4)}
.search .kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line-strong);border-radius:4px;padding:0 4px;color:var(--ink-4)}
.top-right{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
.live{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 8px;font-size:12px;font-weight:600;color:var(--ink-2);user-select:none}
.live .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(32,103,79,.5);animation:livepulse 2s infinite}
.live.paused .pulse{animation:none;background:var(--ink-4);box-shadow:none}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(32,103,79,.45)}70%{box-shadow:0 0 0 7px rgba(32,103,79,0)}100%{box-shadow:0 0 0 0 rgba(32,103,79,0)}}
.date-chip{font-size:12px;color:var(--ink-3);white-space:nowrap}
.lang-btn{border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:5px 10px;font-weight:600;font-size:12px;background:var(--surface);color:var(--ink);display:flex;align-items:center;gap:6px}
.lang-btn:hover{background:var(--surface-2)}
.lang-btn svg{width:14px;height:14px;color:var(--ink-3)}
.icon-btn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-3);position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .badge{position:absolute;top:4px;inset-inline-end:4px;min-width:14px;height:14px;border-radius:7px;background:var(--amber);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;padding-inline:3px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft-2);color:var(--accent-deep);display:grid;place-items:center;font-weight:700;font-size:11px}

.content{flex:1;min-height:0;overflow:auto;padding:18px 20px 28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.screen-head h1{font-size:18px;font-weight:600;letter-spacing:-.01em}
.screen-head .desc{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:6px 11px;font-weight:600;font-size:12.5px;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep)}
.btn.ghost{border-color:transparent;color:var(--ink-2)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--red)}
.btn svg{width:14px;height:14px}
button svg{width:1em;height:1em}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--accent-soft);color:var(--accent-deep)}
.pill.info{background:var(--blue-soft);color:#1E4FBF}
.pill.warn{background:var(--amber-soft);color:#8A5208}
.pill.bad{background:var(--red-soft);color:#A12020}
.pill.neutral{background:var(--surface-3);color:var(--ink-2)}
.pill.line{background:transparent;border-color:var(--line-strong);color:var(--ink-2)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.running .d{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:3px 8px;font-size:11.5px;color:var(--ink-2)}
.chip .sw{width:9px;height:9px;border-radius:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:13px;font-weight:600}
.card-h .more{color:var(--ink-3);font-size:12px}
.card-b{padding:14px 16px}
.card-b.tight{padding:8px 10px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:2fr 1fr}
.g-3{grid-template-columns:1fr 1fr 1fr}
.g-conv{grid-template-columns:300px minmax(0,1fr) 300px}
.g-disp{grid-template-columns:280px minmax(0,1fr)}
.g-plan{grid-template-columns:260px minmax(0,1fr) 340px}
.g-drv{grid-template-columns:260px minmax(0,1fr) 320px}
.g-flow{grid-template-columns:260px minmax(0,1fr)}
.g-an{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.sep-v{width:1px;background:var(--line);align-self:stretch}

/* KPI tiles */
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k-label{font-size:12px;color:var(--ink-3);font-weight:500}
.kpi .k-val{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.kpi .k-val .u{font-size:13px;color:var(--ink-3);font-weight:500;letter-spacing:0}
.kpi .k-sub{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.kpi .k-sub .up{color:var(--accent-deep);font-weight:600}
.kpi .k-sub .dn{color:var(--accent-deep);font-weight:600}
.kpi .spark{height:28px;width:100%;margin-top:2px}
.kpi.flash{animation:kflash 1.4s ease}
@keyframes kflash{0%{box-shadow:0 0 0 0 rgba(32,103,79,.0)}25%{box-shadow:0 0 0 3px rgba(32,103,79,.35)}100%{box-shadow:var(--shadow)}}

/* progress & meters */
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .6s ease}
.bar > i.warn{background:var(--amber)}
.bar > i.bad{background:var(--red)}
.bar > i.blue{background:var(--blue)}
.meter{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.meter .bar{flex:1;min-width:40px}

/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
[dir=rtl] .tbl th{letter-spacing:0}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.rowbtn{cursor:pointer}
.tbl tr.rowbtn:hover td{background:var(--surface-2)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl td.num,.tbl th.num{text-align:end;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:middle;margin-inline-end:6px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li.on{background:var(--accent-soft)}
.li .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 30px;background:var(--surface-3);color:var(--ink-2)}
.li .ico svg{width:16px;height:16px}
.li .ico.wa{background:#DCF3E6;color:#1F8A4C}
.li .ico.voice{background:var(--blue-soft);color:#1E4FBF}
.li .ico.sms{background:#EDE7F8;color:#6A3FB5}
.li .ico.mail{background:var(--amber-soft);color:#8A5208}
.li .ico.driver{background:var(--surface-3);color:var(--ink-2)}
.li .body{flex:1;min-width:0}
.li .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.li .t .n{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t .tm{font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums;flex:0 0 auto}
.li .p{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.li .tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.li.new{animation:slidein .5s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* feed */
.feed{display:flex;flex-direction:column}
.fi{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;align-items:flex-start}
.fi:last-child{border-bottom:0}
.fi .tm{font-family:var(--mono);font-size:11px;color:var(--ink-4);flex:0 0 40px;padding-top:2px}
.fi .ic{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 8px;background:var(--ink-4)}
.fi .ic.ok{background:var(--accent)}.fi .ic.info{background:var(--blue)}.fi .ic.warn{background:var(--amber)}.fi .ic.bad{background:var(--red)}
.fi .tx{flex:1;min-width:0;color:var(--ink-2)}
.fi .tx b{color:var(--ink);font-weight:600}
.fi.new{animation:slidein .5s ease}

/* decision queue */
.dq{border:1px solid var(--amber);background:#FFFBF3;border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;animation:slidein .5s ease}
.dq .dq-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dq .dq-h .n{font-weight:600}
.dq .opt{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.dq .opt button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:7px 10px;text-align:start;font-size:12px}
.dq .opt button:hover{border-color:var(--accent);background:var(--accent-soft)}
.dq .opt button .k{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.dq .opt button.rec{border-color:var(--accent)}
.dq .sum{font-size:12px;color:var(--ink-2);line-height:1.5}
.empty{padding:22px 12px;text-align:center;color:var(--ink-4);font-size:12px}

/* conversation */
.conv-wrap{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:14px;height:calc(100vh - var(--top-h) - 46px);min-height:560px}
.conv-wrap > .card{display:flex;flex-direction:column;min-height:0}
.inbox-tabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line)}
.inbox-tabs button{padding:5px 9px;border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--ink-3)}
.inbox-tabs button.on{background:var(--surface-3);color:var(--ink)}
.inbox{overflow:auto;flex:1}
.thread{flex:1;min-height:0;display:flex;flex-direction:column}
.thread-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.thread-h .who{flex:1;min-width:0}
.thread-h .who .n{font-weight:600;font-size:14px}
.thread-h .who .m{font-size:12px;color:var(--ink-3)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.msg{max-width:72%;display:flex;flex-direction:column;gap:3px;animation:slidein .35s ease}
.msg.customer{align-self:flex-start}
.msg.agent{align-self:flex-end}
.msg .bub{padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.5;background:var(--surface);border:1px solid var(--line);white-space:pre-line}
.msg.customer .bub{border-start-start-radius:4px}
.msg.agent .bub{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep);border-start-end-radius:4px}
.msg .meta{font-size:10.5px;color:var(--ink-4);display:flex;gap:6px;padding-inline:4px}
.msg.agent .meta{justify-content:flex-end}
.msg .meta .ok{color:var(--accent)}
.msg.voice .bub{display:flex;flex-direction:column;gap:6px}
.wave{display:flex;align-items:center;gap:2px;height:18px}
.wave i{display:block;width:3px;border-radius:2px;background:currentColor;opacity:.75}
.act{align-self:stretch;display:flex;flex-direction:column;gap:6px;margin:2px 10%;animation:slidein .35s ease}
.act .a{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);font-size:12px}
.act .a .tool{font-family:var(--mono);font-size:11.5px;color:var(--ink);background:var(--surface-3);padding:1px 6px;border-radius:4px}
.act .a .sys{font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.act .a .res{flex:1;min-width:0;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .a .ms{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);white-space:nowrap}
.act .a .st{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;flex:0 0 14px}
.act .a .st.ok{background:var(--accent);color:#fff}
.act .a .st.run{border:2px solid var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.act .a .st.warn{background:var(--amber);color:#fff}
.act .a .st svg{width:9px;height:9px}
@keyframes spin{to{transform:rotate(360deg)}}
.sysline{align-self:center;font-size:11px;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;animation:slidein .35s ease}
.sysline.warn{color:#8A5208;border-color:var(--amber);background:var(--amber-soft)}
.sysline.ok{color:var(--accent-deep);border-color:var(--accent-soft-2);background:var(--accent-soft)}
.typing{align-self:flex-end;display:flex;gap:4px;padding:10px 14px;background:var(--accent-deep);border-radius:14px;border-start-end-radius:4px}

.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center;color:var(--ink-4);font-size:12.5px}
.composer .in{flex:1;border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;background:var(--surface)}
.side-pane{overflow:auto;flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h4{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;font-weight:600}
[dir=rtl] .sec h4{letter-spacing:0}
.checks{display:flex;flex-direction:column;gap:5px;font-size:12px}
.checks div{display:flex;align-items:center;gap:7px}
.checks .ck{width:14px;height:14px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:0 0 14px}
.checks .ck.pend{background:var(--surface-3);color:var(--ink-4)}
.checks .ck svg{width:9px;height:9px}
.outcome{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.outcome div{background:var(--surface-2);border-radius:var(--r-sm);padding:8px;text-align:center}
.outcome .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

/* dispatch */
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:14px}
.day{padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.day:hover{border-color:var(--line-strong)}

.day .dn{font-weight:600;font-size:12.5px;display:flex;justify-content:space-between}
.day .dn .today{font-size:10px;color:var(--accent-deep);font-weight:700}
.day .ds{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.flash{animation:kflash 1.4s ease}
.routes{display:flex;flex-direction:column}
.rt{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.rt:last-child{border-bottom:0}
.rt:hover{background:var(--surface-2)}
.rt.on{background:var(--accent-soft)}
.rt .r1{display:flex;align-items:center;gap:8px}
.rt .r1 .n{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt .r2{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.rt .r2 .bar{flex:1}
.map-box{position:relative;background:var(--map-sea);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.map-box .legend{position:absolute;bottom:10px;inset-inline-start:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px;display:flex;gap:10px;font-size:11px;color:var(--ink-2);flex-wrap:wrap;max-width:calc(100% - 20px)}
.map-box .legend span{display:flex;align-items:center;gap:5px}
.map-box .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.map-box .mtitle{position:absolute;top:10px;inset-inline-start:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 9px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.timeline{position:relative;padding:4px 0}
.tl-row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;height:30px;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-row .lbl{font-size:12px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px;min-width:0}
.tl-row .lbl .sw{flex:0 0 9px;margin:0}
.tl-row .lbl span.tx{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl-track{position:relative;height:18px;background:var(--surface-2);border-radius:4px}
.tl-track i{position:absolute;top:4px;height:10px;width:6px;border-radius:2px;background:var(--line-strong)}
.tl-track i.done{background:var(--accent)}
.tl-track i.cur{background:var(--blue);top:2px;height:14px;width:8px;box-shadow:0 0 0 2px rgba(37,99,235,.25)}
.tl-track i.risk{background:var(--amber)}
.tl-track i.failed{background:var(--red)}
.tl-track i.moved{opacity:0;transition:opacity .5s}
.tl-axis{display:grid;grid-template-columns:150px 1fr;gap:10px;height:18px}
.tl-axis .ax{position:relative;font-size:10px;color:var(--ink-4);font-family:var(--mono)}
.tl-axis .ax span{position:absolute;top:0;transform:translateX(-50%)}
[dir=rtl] .tl-axis .ax span{transform:translateX(50%)}
.now-line{position:absolute;top:0;bottom:0;width:1px;background:var(--red);opacity:.7;z-index:2;pointer-events:none}
.now-line::after{content:attr(data-t);position:absolute;top:-16px;inset-inline-start:-18px;font-family:var(--mono);font-size:10px;color:var(--red);background:var(--surface);padding:0 3px;border-radius:3px}
.stops{display:flex;flex-direction:column;max-height:420px;overflow:auto}
.stop{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center;font-size:12px}
.stop:last-child{border-bottom:0}
.stop .sq{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--surface-3);color:var(--ink-2);font-variant-numeric:tabular-nums}
.stop.done .sq{background:var(--accent);color:#fff}
.stop.cur .sq{background:var(--blue);color:#fff}
.stop.risk .sq{background:var(--amber);color:#fff}
.stop.failed .sq{background:var(--red);color:#fff}
.stop .sn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop .sm{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop .st{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:end}
.stop.hl{background:var(--amber-soft)}
.stop.gone{opacity:.35;text-decoration:line-through}

/* planner */
.cal{display:grid;grid-template-columns:90px repeat(5,minmax(0,1fr));gap:6px;font-size:12px}
.cal .ch{font-size:11px;color:var(--ink-3);font-weight:600;text-align:center;padding:4px}
.cal .wk{font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px;padding-inline:6px}
.cal .wk .ab{font-family:var(--mono);font-size:10px;background:var(--surface-3);border-radius:4px;padding:0 5px}
.cal .cell{border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px;min-height:62px;background:var(--surface);display:flex;flex-direction:column;gap:3px}
.cal .cell .ln{font-weight:600;font-size:11.5px;display:flex;justify-content:space-between;gap:4px}
.cal .cell .ln span:last-child{color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.cal .cell .bar{height:4px}
.cal .cell.lock{background:var(--surface-2)}
.cal .cell.chg{border-color:var(--amber);background:#FFFBF3}
.pc{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px;animation:slidein .4s ease}
.pc.pend{border-color:var(--amber);background:#FFFBF3}
.pc .pc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pc .pc-h .n{font-weight:600;font-size:12.5px}
.pc .imp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11.5px}
.pc .imp div{background:var(--surface-2);border-radius:var(--r-sm);padding:5px 7px}
.pc .imp .v{font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.pc .imp .l{color:var(--ink-3);font-size:10.5px}
.pc .pc-a{display:flex;gap:6px;margin-top:2px}
.terr{display:flex;flex-direction:column}
.terr div{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;gap:8px}
.terr div:last-child{border-bottom:0}
.terr div.on{background:var(--accent-soft)}

/* driver phone */
.phone{width:320px;height:640px;margin:0 auto;border-radius:36px;background:#111;padding:10px;box-shadow:var(--shadow-2);position:relative}
.phone .scr{background:var(--surface-2);border-radius:28px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
.phone .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:24px;background:#111;border-radius:0 0 14px 14px;z-index:3}
.phone .sb{height:38px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px 4px;font-size:11px;font-weight:600;color:var(--ink)}
.phone .ph{padding:10px 14px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.phone .ph .t{font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.phone .ph .s{font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;margin-top:2px}
.phone .body{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.phone .cur-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.phone .cur-card .cn{font-weight:700;font-size:13.5px}
.phone .cur-card .ca{font-size:12px;color:var(--ink-2)}
.phone .items{display:flex;flex-direction:column;gap:3px;font-size:12px}
.phone .items div{display:flex;justify-content:space-between}
.phone .note{background:var(--amber-soft);border-radius:8px;padding:6px 8px;font-size:11.5px;color:#6E4206}
.phone .brief{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:8px;padding:6px 8px;font-size:11.5px;color:var(--accent-deep)}
.phone .brief .play{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:0 0 22px}
.phone .brief .play svg{width:10px;height:10px}
.phone .pbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px}
.phone .pbtns button{border:1px solid var(--line-strong);border-radius:8px;padding:7px;font-size:12px;font-weight:600;background:var(--surface)}
.phone .pbtns button svg{width:13px;height:13px;vertical-align:-2px;margin-inline-end:3px}
.phone .pbtns button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.phone .pbtns button.warn{color:var(--amber)}
.phone .pstop{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px}
.phone .pstop .sq{width:20px;height:20px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:10px;font-weight:700}
.phone .pstop.done .sq{background:var(--accent);color:#fff}
.phone .pstop.cur{border-color:var(--blue)}
.phone .pstop.cur .sq{background:var(--blue);color:#fff}
.phone .pstop.risk .sq{background:var(--amber);color:#fff}
.phone .pstop .t{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.phone .tabbar{display:flex;justify-content:space-around;padding:8px 6px 14px;background:var(--surface);border-top:1px solid var(--line);font-size:10px;color:var(--ink-3)}
.phone .tabbar div{display:flex;flex-direction:column;align-items:center;gap:2px}
.phone .tabbar div.on{color:var(--accent-deep);font-weight:600}
.phone .tabbar svg{width:18px;height:18px}
.phone .toastp{position:absolute;left:10px;right:10px;bottom:70px;background:var(--ink);color:#fff;border-radius:10px;padding:9px 12px;font-size:12px;animation:slidein .4s ease;z-index:4}

/* workflows */
.wf-canvas{height:560px;position:relative}
.wf-list .li .n{font-size:12.5px}
.node-panel{position:absolute;top:12px;inset-inline-end:12px;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-2);z-index:5;display:flex;flex-direction:column;max-height:calc(100% - 24px);overflow:auto}
.node-panel .np-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.node-panel .np-h .n{font-weight:600}
.node-panel .np-b{padding:10px 12px;display:flex;flex-direction:column;gap:10px;font-size:12px}
.node-panel .fld label{display:block;font-size:10.5px;color:var(--ink-3);margin-bottom:3px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
[dir=rtl] .node-panel .fld label{letter-spacing:0}
.node-panel .fld .v{border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px;background:var(--surface-2);font-size:12px;white-space:pre-line;line-height:1.45}
.node-panel .fld .v.mono{font-family:var(--mono);font-size:11px}
.wf-tabs{display:flex;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line)}
.wf-tabs button{padding:5px 10px;border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--ink-3)}
.wf-tabs button.on{background:var(--surface-3);color:var(--ink)}
.ver{display:flex;flex-direction:column;gap:6px}
.ver div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-sm)}
.ver div.live{border-color:var(--accent-soft-2);background:var(--accent-soft)}

/* analytics charts */
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);display:none;z-index:3}
.legend-row{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);margin-bottom:8px;flex-wrap:wrap}
.legend-row span{display:flex;align-items:center;gap:6px}
.legend-row i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hbar{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;font-size:12px;padding:4px 0}
.hbar .bar{height:8px}
.hbar .v{text-align:end;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* integrations */
.ig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ig .card{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ig .ig-h{display:flex;align-items:center;gap:10px}
.ig .mark{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
.ig .n{font-weight:600;font-size:13.5px}
.ig .d{font-size:12px;color:var(--ink-3)}
.ig .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

/* toasts */
.toasts{position:fixed;bottom:18px;inset-inline-end:18px;display:flex;flex-direction:column;gap:8px;z-index:50;pointer-events:none;max-width:min(380px,calc(100vw - 36px))}
.toast{background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:var(--r);box-shadow:var(--shadow-2);padding:10px 12px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;animation:slidein .35s ease;pointer-events:auto}
.toast.warn{border-inline-start-color:var(--amber)}
.toast.info{border-inline-start-color:var(--blue)}
.toast .tt{font-weight:600}
.toast .tm{font-size:11.5px;color:var(--ink-3)}
.toast.out{opacity:0;transform:translateY(6px);transition:all .4s}

/* help overlay (presenter only) */
.help{position:fixed;inset:0;background:rgba(28,30,34,.55);z-index:100;display:grid;place-items:center}
.help .hbox{background:var(--surface);border-radius:var(--r-lg);padding:22px 24px;width:min(520px,92vw);box-shadow:var(--shadow-2)}
.help .hbox h3{font-size:15px;margin-bottom:10px}
.help .keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.help kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:var(--surface-2)}

/* responsive */
@media (max-width:1180px){
  .g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}
  .conv-wrap{grid-template-columns:260px minmax(0,1fr);}
  .conv-wrap > .card:nth-child(3){display:none}
  .g-plan{grid-template-columns:220px minmax(0,1fr)}
  .g-plan > :nth-child(3){grid-column:1/-1}
  .g-drv{grid-template-columns:220px minmax(0,1fr)}
  .g-drv > :nth-child(3){grid-column:1/-1}
  .ig{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .side{display:none}
  .g-kpi,.g-2,.g-3,.g-conv,.g-disp,.g-plan,.g-drv,.g-flow,.g-an,.ig{grid-template-columns:1fr}
  .conv-wrap{grid-template-columns:1fr;height:auto}
  .conv-wrap > .card:nth-child(3){display:flex}
  .search{display:none}
  .content{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .daystrip{grid-template-columns:repeat(4,minmax(0,1fr))}
  .phone{width:300px;height:600px}
  .date-chip{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

  // Build the stops of one line on one day (deterministic).
  function buildStops(line, dayOff){
    const r = rng(line.num*1000 + dayOff*17 + 7);

    const n = line.n + Math.round((r()-.5)*6);
    const A = line.anchors;
    for(let i=0;i<n;i++){

      const office = r()<0.25;
      const ni = Math.floor(r()*(office?OFFICES.he.length:HOMES.he.length));
      const si = Math.floor(r()*STREETS.he.length), hn = 2+Math.floor(r()*120);
      const jugs = office ? 4+Math.floor(r()*7) : 2+Math.floor(r()*3);

      stops.push({ id: line.id+'-'+dayOff+'-'+(i+1), seq:i+1, x:Math.round(x), y:Math.round(y), office,

    }
    return stops;

  function windowOf(mins){ const s = Math.floor((mins-60)/120)*120+60; return hhmm(s)+'–'+hhmm(s+120); }
  function hhmm(m){ m=Math.round(m); const h=Math.floor(m/60), mm=m%60; return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm; }

  function buildDay(dayOff){

    { en: 'Hod HaSharon', he: 'הוד השרון', x: 650, y: 110, minor: true },
    { en: 'Tel Aviv', he: 'תל אביב', x: 252, y: 322 },
    { en: 'Ramat Gan', he: 'רמת גן', x: 432, y: 320 },
    { en: 'Givatayim', he: 'גבעתיים', x: 395, y: 404, minor: true },

  /* -------------------------------------------------------------- helpers */
  function el(tag, attrs, parent) {

    for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);

  const r1 = v => Math.round(v * 10) / 10;
  // Catmull-Rom spline -> cubic Bezier path: gentle, natural-looking curves for coast, river and roads.
  function smooth(pts) {
    let d = `M${pts[0][0]} ${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {

        `${r1(p2[0] - (p3[0] - p1[0]) / 6)} ${r1(p2[1] - (p3[1] - p1[1]) / 6)},${p2[0]} ${p2[1]}`;

  function injectStyle() {
    if (document.getElementById(STYLE_ID)) return;
    const s = document.createElement('style');
    s.id = STYLE_ID;
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  // Base map: sea, land, river, minor streets, roads (casing under fill so junctions merge), labels.
  function drawBase(svg, opts) {
    const labels = [];
    el('rect', { class: 'jm-sea', width: 1000, height: 720 }, svg);
    el('path', { class: 'jm-land', d: smooth(COAST) + 'L1000 720L1000 0Z' }, svg);
    labels.push({ el: el('text', { class: 'jm-sea-label', transform: 'translate(72 340) rotate(-80)' }, svg), en: SEA.en, he: SEA.he });
    el('path', { class: 'jm-park', d: smooth(RIVER.slice(2, 8)) }, svg);   // Yarkon park, hugging the river
    el('path', { class: 'jm-river', d: smooth(RIVER) }, svg);
    const minor = el('g', { class: 'jm-minor' }, svg);
    MINOR.forEach(m => {
      const g = el('g', { transform: m.rot ? `rotate(${m.rot})` : null }, minor);
      m.v.forEach(x => el('path', { d: `M${x} ${m.y[0]}V${m.y[1]}` }, g));
      m.h.forEach(y => el('path', { d: `M${m.x[0]} ${y}H${m.x[1]}` }, g));
    });

  /* ------------------------------------------------------------------ API */
  function create(container, options) {
    const opts = Object.assign({ lang: 'he', showLabels: true, compact: false, onStopClick: null }, options || {});
    injectStyle();
    if (getComputedStyle(container).position === 'static') container.style.position = 'relative';

    const routeById = id => S.routes.find(r => r.id === String(id)) || null;
    const ordered = route => route.stops.slice().sort((a, b) => a.seq - b.seq);

      const he = S.lang === 'he';

      const focused = S.focus === route.id, r = focused ? R_FOCUS : R_BASE;
      const st = stop.status || 'pending', c = route.color;
      let fill = 'var(--surface,#FFFFFF)', stroke = c, sw = 1.5, num = null, check = false, dot = null;
      if (st === 'done') { fill = c; sw = 0; check = focused; }

      else if (st === 'risk') { stroke = AMBER; sw = 2; if (focused) { fill = AMBER; num = '#fff'; } else dot = AMBER; }
      else if (st === 'failed') { fill = RED; sw = 0; num = '#fff'; }

      g.setAttribute('transform', translate(stop.x, stop.y));
      clear(g);
      el('circle', { class: 'jm-hit', r: 12 }, g);                                   // generous hover target
      el('circle', { r: r + 1.5, fill: 'var(--surface,#FFFFFF)' }, g);              // white halo under the marker
      if (st === 'current') el('circle', { class: 'jm-pulse', r: r + 1, stroke: c }, g);
      el('circle', { r, fill, stroke: sw ? stroke : null, 'stroke-width': sw || null }, g);
      if (dot) el('circle', { r: 2, fill: dot }, g);
      if (check) el('path', { class: 'jm-check', d: 'M-3.4 .2L-1.1 2.5L3.4 -2.5' }, g);

      const rec = S.recs[stop.id] = { stop, route, el: el('g', { class: 'jm-stop', 'data-id': stop.id }, L.stops) };
      paintStop(rec);
    }

    // Vehicle: small white "truck" with the route color border and dot.
    function paintVehicle(route) {
      let g = S.vehicles[route.id];
      if (!route.vehicle) { if (g) { g.remove(); delete S.vehicles[route.id]; } return; }

    function applyFocus() {

    // Tooltip ------------------------------------------------------------
    function toPx(x, y) { // viewBox units -> pixels relative to the container

      const q = p.matrixTransform(m), cr = container.getBoundingClientRect();

      clear(tip);

      b.textContent = stop.label || stop.id;

        if (!line.trim()) return;
        const s = document.createElement('span');
        s.dir = 'auto';
        s.textContent = line;

      const p = toPx(stop.x, stop.y);
      if (!p) return;

    const onOut = e => { const g = e.target.closest && e.target.closest('.jm-stop'); if (g && !(e.relatedTarget && g.contains(e.relatedTarget))) hideTip(); };

    svg.addEventListener('mouseout', onOut);
    svg.addEventListener('click', onClick);

    applyLang();

    const api = {
      svg,
      getRoutes: () => S.routes,

      setRoutes(routes) {
        Object.keys(S.anims).forEach(k => cancelAnimationFrame(S.anims[k]));
        S.anims = Object.create(null);
        [L.lines, L.stops, L.vehicles].forEach(clear);
        S.recs = Object.create(null); S.lines = Object.create(null); S.vehicles = Object.create(null);
        hideTip();
        S.routes = (routes || []).map(r => ({
          id: String(r.id), color: r.color || '#2F6BE0', name: r.name || '',
          vehicle: r.vehicle ? { x: +r.vehicle.x, y: +r.vehicle.y } : null,
          stops: (r.stops || []).map((s, i) => {
            const stop = Object.assign({}, s);
            stop.id = String(stop.id); stop.x = +stop.x; stop.y = +stop.y;
            if (stop.seq == null) stop.seq = i + 1;
            if (!stop.status) stop.status = 'pending';
            return stop;
          })

        if (S.focus && !routeById(S.focus)) S.focus = null;
        drawLines();
        S.routes.forEach(route => { ordered(route).forEach(s => makeStop(s, route)); paintVehicle(route); });
        applyFocus();
        return api;
      },

      focusRoute(routeId) {
        S.focus = routeId != null && routeById(routeId) ? String(routeId) : null;
        Object.keys(S.recs).forEach(k => paintStop(S.recs[k]));
        applyFocus();
        return api;
      },

      pulseStop(stopId) {
        const rec = S.recs[stopId];
        if (!rec) return api;
        const ring = el('circle', { class: 'jm-ring', r: (S.focus === rec.route.id ? R_FOCUS : R_BASE) + 1, stroke: rec.route.color }, rec.el);
        setTimeout(() => ring.remove(), 1250);
        return api;
      },

      moveStop(stopId, toRouteId, to) {
        const rec = S.recs[stopId], target = routeById(toRouteId);
        if (!rec || !target || !to) return Promise.reject(new Error('JakoMap.moveStop: unknown stop or route'));
        hideTip();
        const from = { x: rec.stop.x, y: rec.stop.y };
        return new Promise(resolve => {
          animate('stop:' + stopId, 700, t => {
            rec.el.setAttribute('transform', translate(from.x + (to.x - from.x) * t, from.y + (to.y - from.y) * t));
          }, () => {
            const src = rec.route;
            src.stops = src.stops.filter(s => s !== rec.stop);
            ordered(src).forEach((s, i) => { s.seq = i + 1; });          // close the gap in the source route
            rec.stop.x = +to.x; rec.stop.y = +to.y;
            rec.stop.seq = target.stops.reduce((m, s) => Math.max(m, s.seq), 0) + 1;
            target.stops.push(rec.stop);

      },

      setStopStatus(stopId, status) {
        const rec = S.recs[stopId];
        if (rec) { rec.stop.status = status; paintStop(rec); }
        return api;
      },

      setVehicle(routeId, to) {
        const route = routeById(routeId);
        if (!route || !to) return api;
        const from = route.vehicle || { x: +to.x, y: +to.y };
        route.vehicle = { x: from.x, y: from.y };
        paintVehicle(route);
        const g = S.vehicles[route.id];
        animate('veh:' + route.id, 900, t => {
          route.vehicle.x = from.x + (to.x - from.x) * t;
          route.vehicle.y = from.y + (to.y - from.y) * t;
          g.setAttribute('transform', translate(route.vehicle.x, route.vehicle.y));
        });
        return api;
      },

      setLang(lang) { S.lang = lang === 'en' ? 'en' : 'he'; applyLang(); return api; },

      destroy() {
        Object.keys(S.anims).forEach(k => cancelAnimationFrame(S.anims[k]));
        svg.removeEventListener('mouseover', onOver);
        svg.removeEventListener('mouseout', onOut);
        svg.removeEventListener('click', onClick);
        svg.remove();
        tip.remove();
      }
    };
    return api;
  }

  global.JakoMap = { create, version: '1.0.0' };
})(window);

</script>

  function liveRoute(r){
    const now = nowMins();

      let st = state.overrides[s.id];
      if(!st){ if(s.mins < now) st='done'; else st='pending'; }
      return Object.assign({}, s, {status:st});
    });
    const delay = r.id==='L25' ? 18 : 0;
    for(const s of stops){ if(s.status==='pending' && !cur){ s.status='current'; cur=s; } }
    const done = stops.filter(s=>s.status==='done').length;
    const vehicle = cur ? {x:cur.x-14, y:cur.y+10} : (stops.length?{x:stops[stops.length-1].x, y:stops[stops.length-1].y}:null);
    const status = !cur ? 'done' : (delay>12 ? 'late' : (stops.some(s=>s.status==='risk') ? 'risk' : 'ok'));

  // ---------- charts (inline SVG) ----------
  function sparkline(vals, color){ const w=120,h=28; const mx=Math.max(...vals), mn=Math.min(...vals); const pts=vals.map((v,i)=>[i/(vals.length-1)*w, h-2-((v-mn)/((mx-mn)||1))*(h-6)]); const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L'); const last=pts[pts.length-1]; return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}L${w},${h}L0,${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/></svg>`; }
  function lineChart(id, labels, series, opts){
    const W=640, H=220, pl=40, pr=12, pt=14, pb=28; const w=W-pl-pr, h=H-pt-pb;
    const all = series.flatMap(s=>s.v); const mx = opts.max || Math.ceil(Math.max(...all)*1.1/10)*10, mn = 0;
    const x = i => pl + i/(labels.length-1)*w, y = v => pt + h - (v-mn)/(mx-mn)*h;
    const ticks = 4; let g='';
    for(let i=0;i<=ticks;i++){ const v=mn+(mx-mn)*i/ticks; g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${Math.round(v)}</text>`; }
    labels.forEach((l,i)=>{ g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${esc(l)}</text>`; });
    series.forEach(s=>{ const d='M'+s.v.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join('L'); if(s.area) g += `<path d="${d}L${x(s.v.length-1)},${y(0)}L${x(0)},${y(0)}Z" fill="${s.color}" opacity=".08"/>`; g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`; s.v.forEach((v,i)=>{ g += `<circle cx="${x(i)}" cy="${y(v)}" r="${i===s.v.length-1?4:2.5}" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5"/>`; }); const lv = s.v[s.v.length-1]; g += `<text x="${x(s.v.length-1)-8}" y="${y(lv)-9}" text-anchor="end" font-size="11" font-weight="600" fill="var(--ink)">${lv}</text>`; });
    if(opts.marker!=null){ g += `<line x1="${x(opts.marker)}" x2="${x(opts.marker)}" y1="${pt}" y2="${pt+h}" stroke="var(--ink-4)" stroke-dasharray="3 3"/><text x="${x(opts.marker)+4}" y="${pt+10}" font-size="10" fill="var(--ink-3)">${esc(opts.markerLabel||'')}</text>`; }
    // hover targets
    labels.forEach((l,i)=>{ const tip = series.map(s=>`${esc(s.name)}: ${s.v[i]}`).join(' · '); g += `<rect class="hov" x="${x(i)-w/labels.length/2}" y="${pt}" width="${w/labels.length}" height="${h}" fill="transparent" data-tip="${esc(l)} · ${tip}" data-x="${x(i)}" data-y="${y(Math.max(...series.map(s=>s.v[i])))}"/>`; });
    return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="tip"></div></div>`;
  }
  function barChart(id, labels, vals, color, opts){
    const W=640, H=220, pl=40, pr=12, pt=14, pb=28; const w=W-pl-pr, h=H-pt-pb;
    const mx = Math.ceil(Math.max(...vals)*1.1/100)*100 || 10; const y = v => pt + h - v/mx*h; const bw = w/labels.length*0.56; let g='';
    for(let i=0;i<=4;i++){ const v=mx*i/4; g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${Math.round(v)}</text>`; }
    labels.forEach((l,i)=>{ const cx = pl + (i+.5)*w/labels.length; const top = y(vals[i]); g += `<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${Math.max(0,pt+h-top)}" rx="3" fill="${color}"/><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${esc(l)}</text>`; if(i===labels.length-1) g += `<text x="${cx}" y="${top-6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${vals[i]}</text>`; g += `<rect class="hov" x="${cx-w/labels.length/2}" y="${pt}" width="${w/labels.length}" height="${h}" fill="transparent" data-tip="${esc(l)} · ${vals[i]}" data-x="${cx}" data-y="${top}"/>`; });
    return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="tip"></div></div>`;
  }
  function groupedBars(labels, a, b, ca, cb){
    const W=640, H=180, pl=34, pr=10, pt=10, pb=26; const w=W-pl-pr, h=H-pt-pb; const mx = Math.ceil(Math.max(...a,...b)*1.15/10)*10 || 10; const y=v=>pt+h-v/mx*h; let g='';
    for(let i=0;i<=3;i++){ const v=mx*i/3; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${Math.round(v)}</text>`; }
    const slot = w/labels.length, bw = slot*0.28;
    labels.forEach((l,i)=>{ const cx=pl+(i+.5)*slot; g+=`<rect x="${cx-bw-1}" y="${y(a[i])}" width="${bw}" height="${pt+h-y(a[i])}" rx="2" fill="${ca}"/><rect x="${cx+1}" y="${y(b[i])}" width="${bw}" height="${pt+h-y(b[i])}" rx="2" fill="${cb}"/><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${esc(l)}</text><rect class="hov" x="${cx-slot/2}" y="${pt}" width="${slot}" height="${h}" fill="transparent" data-tip="${esc(l)}:00 · ${a[i]} / ${b[i]}" data-x="${cx}" data-y="${y(Math.max(a[i],b[i]))}"/>`; });
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="tip"></div></div>`;
  }

        addr:T('—','—'), extract:{ trigger:'eta_delay > 15 min', customers:6, channel:'whatsapp' }, checks:[{k:'ck_id',ok:true},{k:'ck_cap',ok:true},{k:'ck_win',ok:true},{k:'ck_conf',ok:true},{k:'ck_sum',ok:true}] });
      push(c5, { k:'sys', warn:true, he:'DispatchTrack · קו 25 · עיכוב 18 דק׳ בכביש 4 · 6 תחנות מושפעות', en:'DispatchTrack · Line 25 · 18 min delay on Road 4 · 6 stops affected' });
      push(c5, { k:'act', tool:'get_affected_stops', sys:'DispatchTrack', he:'תחנות 19–24 · הגעה חדשה +18 דק׳', en:'Stops 19–24 · new ETA +18 min', ms:ms() });
      push(c5, { k:'act', tool:'send_whatsapp', sys:'WhatsApp', he:'6 הודעות נשלחו · 4 נקראו', en:'6 messages sent · 4 read', ms:ms() });
      push(c5, { k:'a', t:A.nowStr(), he:'שלום, עדכון מהשירות של מי עדן: הנהג שמעון מתעכב כ-18 דקות בגלל עומס בכביש 4. ההגעה המשוערת החדשה: 13:05–13:35. אם זה לא מתאים, אפשר לענות כאן ונתאם מועד אחר.', en:'Hi, an update from Mei Eden service: driver Shimon is running about 18 minutes late because of traffic on Road 4. New ETA: 13:05–13:35. If that does not work, reply here and we will set another time.' });
      push(c5, { k:'c', t:A.nowStr(), he:'סבבה, תודה על העדכון', en:'Fine, thanks for the update' });
      bump(); A.feed('', 'ok', 'קו 25 · 6 לקוחות קיבלו עדכון הגעה · 0 שיחות למוקד', 'Line 25 · 6 customers got a new ETA · 0 calls to the service center');
      A.toast(A.t('ch_whatsapp')+' · '+A.tx(c5.intent), (st.lang==='he'?'6 לקוחות עודכנו אוטומטית':'6 customers updated automatically'), 'info'); showConv(c5); }
  ];

  const SC = [S1, S2, S3, S4, S5];
  let si=0, sti=0, timer=null;
  function step(){ if(waitingDecision){ const w=waitingDecision; waitingDecision=null; w(); return true; } if(si>=SC.length) return false; const fn = SC[si][sti]; sti++; if(sti>=SC[si].length){ si++; sti=0; } try{ fn(); }catch(e){ console.error(e); } return true; }
  function schedule(){ clearTimeout(timer); if(!st.playing) return; const wait = waitingDecision ? 7000 : (sti===0 ? 9000 : 4200); timer = setTimeout(()=>{ const ok = step(); if(ok) schedule(); else { st.playing=false; A.updateNavCounts(); } }, wait); }
  window.JakoLive = {
    next(){ step(); if(st.playing) schedule(); },
    toggle(){ st.playing = !st.playing; A.updateNavCounts(); if(st.playing) schedule(); else clearTimeout(timer); },
    busy(){ return busy; }
  };

  // ambient: newly completed stops show up in the feed as the day advances
  let lastDone = {}; A.dayRoutes(0).forEach(r=>lastDone[r.id]=r.done);
  setInterval(()=>{ const rs = A.dayRoutes(0); let n=0; rs.forEach(r=>{ if(r.done>lastDone[r.id]){ const s = r.stops.filter(x=>x.status==='done').slice(-1)[0]; if(s && n<2){ A.feed('', 'ok', A.tx(r.name).split(' · ')[0]+' · תחנה '+s.seq+' סופקה · '+s.name.he+' · הוכחת מסירה', r.name.en.split(' · ')[0]+' · stop '+s.seq+' delivered · '+s.name.en+' · proof of delivery'); n++; } lastDone[r.id]=r.done; } }); }, 30000);
})();
